<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Minesweeper in the browser: clear the field without hitting a mine." />
    <title>Minesweeper | Umar Hasan</title>
    <style>
      :root {
        --bg: #0b1120;
        --card: #111827;
        --card-hover: #151f32;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.12);
        --border: #1f2937;
        --danger: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.08), transparent 40%),
          radial-gradient(circle at 85% 20%, rgba(129, 140, 248, 0.08), transparent 40%),
          linear-gradient(180deg, #020617 0%, var(--bg) 45%);
        background-attachment: fixed;
        color: var(--text);
      }

      .container {
        max-width: 920px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3.5rem;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
      }

      nav a {
        color: var(--muted);
        text-decoration: none;
      }

      nav a:hover {
        color: var(--accent);
      }

      header h1 {
        margin: 0 0 0.35rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }

      header p {
        margin: 0;
        color: var(--muted);
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.5rem;
        margin-top: 1.5rem;
      }

      .controls {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .toggle-group {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      .toggle-group button {
        background: #0b1120;
        border: none;
        color: var(--muted);
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .toggle-group button.active {
        background: var(--accent);
        color: #0b1120;
        font-weight: 600;
      }

      .btn {
        background: #0b1120;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .btn:hover {
        border-color: var(--accent);
      }

      .btn.on {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      .btn.push {
        margin-left: auto;
      }

      .stats {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }

      .stats div {
        min-width: 110px;
        background: #0b1120;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.5rem 0.8rem;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .stats strong {
        display: block;
        font-size: 1.2rem;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .status {
        margin: 1rem 0;
        text-align: center;
        font-weight: 600;
        min-height: 1.4em;
      }

      .status.win {
        color: var(--accent);
      }

      .status.lose {
        color: var(--danger);
      }

      .scroll {
        overflow-x: auto;
        padding-bottom: 0.25rem;
      }

      .field {
        display: grid;
        gap: 2px;
        width: max-content;
        margin: 0 auto;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      .tile {
        width: var(--size);
        height: var(--size);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: #1e293b;
        color: var(--text);
        font: 700 calc(var(--size) * 0.5) / 1 Inter, system-ui, sans-serif;
        cursor: pointer;
        -webkit-touch-callout: none;
      }

      .tile:hover {
        background: #273449;
      }

      .tile.open {
        background: #0b1120;
        cursor: default;
      }

      .tile.boom {
        background: rgba(248, 113, 113, 0.35);
      }

      .tile.wrong {
        background: rgba(248, 113, 113, 0.15);
      }

      .n1 { color: #38bdf8; }
      .n2 { color: #34d399; }
      .n3 { color: #fb7185; }
      .n4 { color: #818cf8; }
      .n5 { color: #fb923c; }
      .n6 { color: #22d3ee; }
      .n7 { color: #e5e7eb; }
      .n8 { color: #94a3b8; }

      .hint {
        margin: 1rem 0 0;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }

      footer {
        margin-top: 2rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <nav>
        <a href="index.html">&larr; Umar Hasan</a>
      </nav>

      <header>
        <h1>Minesweeper</h1>
        <p>Open every safe tile. Numbers show how many mines touch that tile. Your first click is always safe.</p>
      </header>

      <section class="panel">
        <div class="controls">
          <div class="toggle-group" id="level-toggle">
            <button data-level="easy" class="active">Easy</button>
            <button data-level="medium">Medium</button>
            <button data-level="hard">Hard</button>
          </div>
          <button id="flag-mode" class="btn push" aria-pressed="false">🚩 Flag mode</button>
          <button id="reset" class="btn">New Game</button>
        </div>

        <div class="stats">
          <div>Mines left<strong id="mines">10</strong></div>
          <div>Time<strong id="time">0</strong></div>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
        <div class="scroll">
          <div id="field" class="field"></div>
        </div>
        <p class="hint">Right-click or long-press to flag. Click a number whose mines are all flagged to open its neighbours.</p>
      </section>

      <footer>&copy; 2026 Umar Hasan</footer>
    </main>

    <script>
      const LEVELS = {
        easy: { rows: 9, cols: 9, mines: 10, size: 36 },
        medium: { rows: 16, cols: 16, mines: 40, size: 30 },
        hard: { rows: 16, cols: 30, mines: 99, size: 28 },
      };
      const LONG_PRESS_MS = 450;

      const fieldEl = document.getElementById("field");
      const statusEl = document.getElementById("status");
      const minesEl = document.getElementById("mines");
      const timeEl = document.getElementById("time");
      const levelToggle = document.getElementById("level-toggle");
      const flagModeBtn = document.getElementById("flag-mode");

      let level = "easy";
      let rows, cols, mineCount;
      let tiles = []; // { mine, n, open, flag, el }
      let started = false;
      let over = false;
      let flagMode = false;
      let timer = null;
      let seconds = 0;

      function neighbours(i) {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const out = [];
        for (let dr = -1; dr <= 1; dr++)
          for (let dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue;
            const rr = r + dr;
            const cc = c + dc;
            if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) out.push(rr * cols + cc);
          }
        return out;
      }

      function placeMines(safe) {
        const banned = new Set([safe, ...neighbours(safe)]);
        const pool = tiles.map((_, i) => i).filter((i) => !banned.has(i));
        for (let k = 0; k < mineCount; k++) {
          const j = k + Math.floor(Math.random() * (pool.length - k));
          [pool[k], pool[j]] = [pool[j], pool[k]];
          tiles[pool[k]].mine = true;
        }
        tiles.forEach((t, i) => (t.n = neighbours(i).filter((j) => tiles[j].mine).length));
      }

      function startTimer() {
        timer = setInterval(() => {
          seconds++;
          timeEl.textContent = seconds;
        }, 1000);
      }

      function stopTimer() {
        clearInterval(timer);
        timer = null;
      }

      function draw(i) {
        const t = tiles[i];
        const el = t.el;
        el.className = "tile";
        el.textContent = "";
        if (t.open) {
          el.classList.add("open");
          if (t.mine) {
            el.textContent = "💣";
            if (t.boom) el.classList.add("boom");
          } else if (t.n) {
            el.textContent = t.n;
            el.classList.add("n" + t.n);
          }
        } else if (t.flag) {
          el.textContent = "🚩";
          if (over && !t.mine) el.classList.add("wrong");
        }
      }

      function updateCounts() {
        minesEl.textContent = mineCount - tiles.filter((t) => t.flag).length;
      }

      function open(i) {
        const stack = [i];
        while (stack.length) {
          const j = stack.pop();
          const t = tiles[j];
          if (t.open || t.flag) continue;
          t.open = true;
          draw(j);
          if (t.mine) return lose(j);
          if (t.n === 0) stack.push(...neighbours(j));
        }
        checkWin();
      }

      function lose(i) {
        over = true;
        stopTimer();
        tiles[i].boom = true;
        tiles.forEach((t, j) => {
          if (t.mine && !t.flag) t.open = true;
          draw(j);
        });
        statusEl.textContent = "Boom! You hit a mine.";
        statusEl.className = "status lose";
      }

      function checkWin() {
        if (over || tiles.some((t) => !t.mine && !t.open)) return;
        over = true;
        stopTimer();
        tiles.forEach((t, j) => {
          if (t.mine) t.flag = true;
          draw(j);
        });
        updateCounts();
        statusEl.textContent = `Cleared in ${seconds} seconds!`;
        statusEl.className = "status win";
      }

      function toggleFlag(i) {
        const t = tiles[i];
        if (over || t.open) return;
        t.flag = !t.flag;
        draw(i);
        updateCounts();
      }

      function reveal(i) {
        if (over) return;
        const t = tiles[i];
        if (!started) {
          started = true;
          placeMines(i);
          startTimer();
        }
        if (t.open) {
          // Chord: open the neighbours once enough flags are placed.
          const around = neighbours(i);
          if (t.n && around.filter((j) => tiles[j].flag).length === t.n) {
            around.forEach((j) => !over && !tiles[j].flag && open(j));
          }
          return;
        }
        if (!t.flag) open(i);
      }

      function newGame() {
        stopTimer();
        ({ rows, cols, mines: mineCount } = LEVELS[level]);
        fieldEl.style.setProperty("--size", `${LEVELS[level].size}px`);
        fieldEl.style.gridTemplateColumns = `repeat(${cols}, var(--size))`;
        fieldEl.innerHTML = "";
        tiles = Array.from({ length: rows * cols }, (_, i) => {
          const el = document.createElement("button");
          el.className = "tile";
          el.dataset.i = i;
          fieldEl.appendChild(el);
          return { mine: false, n: 0, open: false, flag: false, boom: false, el };
        });
        started = false;
        over = false;
        seconds = 0;
        timeEl.textContent = "0";
        statusEl.textContent = "";
        statusEl.className = "status";
        updateCounts();
      }

      // Pointer handling: click opens, right-click or long-press flags.
      let pressTimer = null;
      let longPressed = false;
      let pointerType = "mouse";

      fieldEl.addEventListener("pointerdown", (e) => {
        pointerType = e.pointerType;
        const el = e.target.closest(".tile");
        if (!el || e.pointerType === "mouse") return;
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          toggleFlag(+el.dataset.i);
          if (navigator.vibrate) navigator.vibrate(20);
        }, LONG_PRESS_MS);
      });

      ["pointerup", "pointerleave", "pointercancel"].forEach((type) =>
        fieldEl.addEventListener(type, () => clearTimeout(pressTimer))
      );

      fieldEl.addEventListener("click", (e) => {
        const el = e.target.closest(".tile");
        if (!el) return;
        if (longPressed) {
          longPressed = false;
          return;
        }
        const i = +el.dataset.i;
        if (flagMode && !tiles[i].open) toggleFlag(i);
        else reveal(i);
      });

      fieldEl.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        const el = e.target.closest(".tile");
        // Touch devices flag through the long-press timer instead.
        if (el && pointerType === "mouse") toggleFlag(+el.dataset.i);
      });

      levelToggle.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        level = btn.dataset.level;
        levelToggle.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
        newGame();
      });

      flagModeBtn.addEventListener("click", () => {
        flagMode = !flagMode;
        flagModeBtn.classList.toggle("on", flagMode);
        flagModeBtn.setAttribute("aria-pressed", flagMode);
      });

      document.getElementById("reset").addEventListener("click", newGame);

      newGame();
    </script>
  </body>
</html>
