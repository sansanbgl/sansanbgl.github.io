<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Snakes and Ladders in the browser: 2 to 4 players, with optional computer opponents." />
    <title>Snakes and Ladders | Umar Hasan</title>
    <style>
      :root {
        --bg: #0b1120;
        --card: #111827;
        --card-hover: #151f32;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.12);
        --border: #1f2937;
        --ladder: #fbbf24;
        --snake: #fb7185;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.08), transparent 40%),
          radial-gradient(circle at 85% 20%, rgba(129, 140, 248, 0.08), transparent 40%),
          linear-gradient(180deg, #020617 0%, var(--bg) 45%);
        background-attachment: fixed;
        color: var(--text);
      }

      .container {
        max-width: 640px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3.5rem;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
      }

      nav a {
        color: var(--muted);
        text-decoration: none;
      }

      nav a:hover {
        color: var(--accent);
      }

      header h1 {
        margin: 0 0 0.35rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }

      header p {
        margin: 0;
        color: var(--muted);
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.5rem;
        margin-top: 1.5rem;
      }

      .controls {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .toggle-group {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      .toggle-group button {
        background: #0b1120;
        border: none;
        color: var(--muted);
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .toggle-group button.active {
        background: var(--accent);
        color: #0b1120;
        font-weight: 600;
      }

      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      .reset {
        margin-left: auto;
        background: #0b1120;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .reset:hover {
        border-color: var(--accent);
      }

      .board-wrap {
        position: relative;
        aspect-ratio: 1;
        margin-top: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }

      .board {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(10, 1fr);
      }

      .square {
        background: #0b1120;
        font-size: clamp(0.5rem, 1.8vw, 0.7rem);
        color: var(--muted);
        padding: 0.2rem 0.25rem;
      }

      .square.alt {
        background: #0f172a;
      }

      .square.goal {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
      }

      .overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .token {
        position: absolute;
        width: 4.6%;
        height: 4.6%;
        border-radius: 50%;
        border: 2px solid #020617;
        box-shadow: 0 0 0 1.5px rgba(229, 231, 235, 0.8);
        transform: translate(-50%, -50%);
        transition: left 0.15s ease, top 0.15s ease;
      }

      .token.slide {
        transition: left 0.6s ease-in-out, top 0.6s ease-in-out;
      }

      .turn-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 1.25rem;
      }

      .die {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3.2rem;
        line-height: 1;
        background: #0b1120;
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .die.rolling {
        animation: shake 0.4s ease;
      }

      .status {
        flex: 1;
        font-weight: 600;
      }

      .status small {
        display: block;
        margin-top: 0.2rem;
        font-weight: 400;
        color: var(--muted);
      }

      .roll {
        background: var(--accent);
        color: #0b1120;
        border: none;
        border-radius: 8px;
        padding: 0.65rem 1.2rem;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }

      .roll:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .players {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 0.5rem;
        margin-top: 1.25rem;
      }

      .player {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #0b1120;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.5rem 0.7rem;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .player.active {
        border-color: var(--accent);
        color: var(--text);
      }

      .player .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .player strong {
        margin-left: auto;
        color: var(--text);
      }

      .legend {
        display: flex;
        gap: 1.25rem;
        margin-top: 1rem;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .legend span::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 0.4rem;
        vertical-align: -1px;
        background: var(--c);
      }

      footer {
        margin-top: 2rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      @keyframes shake {
        0%, 100% { transform: rotate(0); }
        25% { transform: rotate(-18deg); }
        75% { transform: rotate(18deg); }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <nav>
        <a href="index.html">&larr; Umar Hasan</a>
      </nav>

      <header>
        <h1>Snakes and Ladders</h1>
        <p>Climb the ladders, dodge the snakes. First to land exactly on 100 wins.</p>
      </header>

      <section class="panel">
        <div class="controls">
          <span>Players</span>
          <div class="toggle-group" id="count-toggle">
            <button data-count="2" class="active">2</button>
            <button data-count="3">3</button>
            <button data-count="4">4</button>
          </div>
          <label><input type="checkbox" id="cpu" checked /> Computer plays others</label>
          <button id="reset" class="reset">New Game</button>
        </div>

        <div class="board-wrap">
          <div id="board" class="board"></div>
          <svg id="overlay" class="overlay" viewBox="0 0 100 100" aria-hidden="true"></svg>
          <div id="tokens"></div>
        </div>

        <div class="legend">
          <span style="--c: var(--ladder)">Ladder: climb up</span>
          <span style="--c: var(--snake)">Snake: slide down</span>
        </div>

        <div class="turn-row">
          <div id="die" class="die" aria-live="polite">⚀</div>
          <div id="status" class="status" aria-live="polite"></div>
          <button id="roll" class="roll">Roll</button>
        </div>

        <div id="players" class="players"></div>
      </section>

      <footer>&copy; 2026 Umar Hasan</footer>
    </main>

    <script>
      const LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };
      const SNAKES = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
      const COLORS = ["#38bdf8", "#818cf8", "#34d399", "#fb923c"];
      const DIE_FACES = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
      const TOKEN_OFFSETS = [[-2, -2], [2, -2], [-2, 2], [2, 2]];

      const boardEl = document.getElementById("board");
      const overlayEl = document.getElementById("overlay");
      const tokensEl = document.getElementById("tokens");
      const dieEl = document.getElementById("die");
      const statusEl = document.getElementById("status");
      const rollBtn = document.getElementById("roll");
      const playersEl = document.getElementById("players");
      const countToggle = document.getElementById("count-toggle");
      const cpuEl = document.getElementById("cpu");

      let playerCount = 2;
      let players = []; // { name, color, pos, cpu, el }
      let turn = 0;
      let busy = false;
      let over = false;
      let message = "";

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // Square n (1-100) in board coordinates (0-100), zig-zagging up from bottom-left.
      function center(n) {
        const row = Math.floor((n - 1) / 10);
        let col = (n - 1) % 10;
        if (row % 2 === 1) col = 9 - col;
        return { x: col * 10 + 5, y: (9 - row) * 10 + 5 };
      }

      function buildBoard() {
        for (let displayRow = 0; displayRow < 10; displayRow++) {
          const row = 9 - displayRow;
          for (let c = 0; c < 10; c++) {
            const col = row % 2 === 1 ? 9 - c : c;
            const n = row * 10 + col + 1;
            const sq = document.createElement("div");
            sq.className = "square" + ((row + c) % 2 ? " alt" : "") + (n === 100 ? " goal" : "");
            sq.textContent = n;
            boardEl.appendChild(sq);
          }
        }

        const svg = [];
        Object.entries(LADDERS).forEach(([from, to]) => {
          const a = center(+from);
          const b = center(+to);
          const len = Math.hypot(b.x - a.x, b.y - a.y);
          const px = (-(b.y - a.y) / len) * 1.8;
          const py = ((b.x - a.x) / len) * 1.8;
          svg.push(
            `<line x1="${a.x + px}" y1="${a.y + py}" x2="${b.x + px}" y2="${b.y + py}" />`,
            `<line x1="${a.x - px}" y1="${a.y - py}" x2="${b.x - px}" y2="${b.y - py}" />`
          );
          const rungs = Math.max(2, Math.floor(len / 4));
          for (let i = 1; i < rungs; i++) {
            const t = i / rungs;
            const x = a.x + (b.x - a.x) * t;
            const y = a.y + (b.y - a.y) * t;
            svg.push(`<line x1="${x + px}" y1="${y + py}" x2="${x - px}" y2="${y - py}" />`);
          }
        });
        const ladders = `<g stroke="var(--ladder)" stroke-width="0.8" stroke-linecap="round">${svg.join("")}</g>`;

        const snakes = Object.entries(SNAKES)
          .map(([from, to]) => {
            const h = center(+from);
            const t = center(+to);
            const len = Math.hypot(t.x - h.x, t.y - h.y);
            const px = (-(t.y - h.y) / len) * 6;
            const py = ((t.x - h.x) / len) * 6;
            const c1 = { x: h.x + (t.x - h.x) / 3 + px, y: h.y + (t.y - h.y) / 3 + py };
            const c2 = { x: h.x + ((t.x - h.x) * 2) / 3 - px, y: h.y + ((t.y - h.y) * 2) / 3 - py };
            return `<path d="M${h.x} ${h.y} C${c1.x} ${c1.y} ${c2.x} ${c2.y} ${t.x} ${t.y}" />
              <circle cx="${h.x}" cy="${h.y}" r="2" fill="var(--snake)" stroke="none" />`;
          })
          .join("");

        overlayEl.innerHTML =
          ladders +
          `<g fill="none" stroke="var(--snake)" stroke-width="1.8" stroke-linecap="round" opacity="0.85">${snakes}</g>`;
      }

      function placeTokens() {
        const byCell = {};
        players.forEach((p) => {
          if (p.pos === 0) {
            p.el.style.display = "none";
            return;
          }
          const slot = (byCell[p.pos] = (byCell[p.pos] || 0) + 1) - 1;
          const { x, y } = center(p.pos);
          const [dx, dy] = TOKEN_OFFSETS[slot];
          p.el.style.display = "block";
          p.el.style.left = `${x + dx}%`;
          p.el.style.top = `${y + dy}%`;
        });
      }

      function render() {
        placeTokens();

        const current = players[turn];
        if (over) statusEl.innerHTML = `${current.name} wins! 🎉<small>${message}</small>`;
        else
          statusEl.innerHTML = `${current.name}'s turn${current.cpu ? " (computer)" : ""}<small>${message || "&nbsp;"}</small>`;
        statusEl.style.color = current.color;
        rollBtn.disabled = busy || over || current.cpu;

        playersEl.innerHTML = players
          .map(
            (p, i) => `<div class="player${i === turn && !over ? " active" : ""}">
              <span class="dot" style="background:${p.color}"></span>${p.name}
              <strong>${p.pos || "Start"}</strong>
            </div>`
          )
          .join("");
      }

      async function roll() {
        if (busy || over) return;
        busy = true;
        const p = players[turn];
        const value = 1 + Math.floor(Math.random() * 6);

        dieEl.classList.remove("rolling");
        void dieEl.offsetWidth;
        dieEl.classList.add("rolling");
        dieEl.textContent = DIE_FACES[value - 1];
        message = `Rolled a ${value}.`;
        render();
        await sleep(400);

        if (p.pos + value > 100) {
          message = `Rolled a ${value}. Needs exactly ${100 - p.pos} to finish.`;
        } else {
          for (let i = 0; i < value; i++) {
            p.pos++;
            placeTokens();
            await sleep(170);
          }
          const jump = LADDERS[p.pos] || SNAKES[p.pos];
          if (jump) {
            message = LADDERS[p.pos]
              ? `Rolled a ${value}. Ladder from ${p.pos} up to ${jump}!`
              : `Rolled a ${value}. Snake from ${p.pos} down to ${jump}.`;
            render();
            await sleep(300);
            p.el.classList.add("slide");
            p.pos = jump;
            placeTokens();
            await sleep(650);
            p.el.classList.remove("slide");
          }
        }

        if (p.pos === 100) {
          over = true;
          busy = false;
          render();
          return;
        }

        turn = (turn + 1) % players.length;
        busy = false;
        render();
        if (players[turn].cpu) {
          await sleep(700);
          roll();
        }
      }

      function newGame() {
        tokensEl.innerHTML = "";
        players = Array.from({ length: playerCount }, (_, i) => {
          const cpu = cpuEl.checked && i > 0;
          const el = document.createElement("div");
          el.className = "token";
          el.style.background = COLORS[i];
          tokensEl.appendChild(el);
          return { name: cpu ? `CPU ${i}` : `Player ${i + 1}`, color: COLORS[i], pos: 0, cpu, el };
        });
        turn = 0;
        over = false;
        busy = false;
        message = "";
        dieEl.textContent = DIE_FACES[0];
        render();
      }

      countToggle.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn || busy) return;
        playerCount = +btn.dataset.count;
        countToggle.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
        newGame();
      });

      cpuEl.addEventListener("change", () => !busy && newGame());
      rollBtn.addEventListener("click", roll);
      document.getElementById("reset").addEventListener("click", () => !busy && newGame());

      buildBoard();
      newGame();
    </script>
  </body>
</html>
